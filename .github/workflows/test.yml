name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit and smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Unit tests
        run: zig build test

      - name: Smoke tests
        run: zig build smoke

name: Release

on:
  workflow_dispatch:

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Parse version from build.zig.zon
        id: read
        run: |
          version=$(grep -oP '(?<=\.version = ")[^"]+' build.zig.zon)
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build all targets
    needs: version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Build all targets
        run: |
          for target in aarch64-macos x86_64-macos aarch64-linux-musl x86_64-linux-musl; do
            zig build -Dtarget=$target
            mkdir -p dist
            tar czf dist/shg-${{ needs.version.outputs.tag }}-${target}.tar.gz \
              -C zig-out/bin shg shg-config
          done

      - uses: actions/upload-artifact@v7
        with:
          name: shg-dist
          path: dist/

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: shg-dist
          path: dist/

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt

      - name: Create tag
        run: |
          git tag ${{ needs.version.outputs.tag }}
          git push origin ${{ needs.version.outputs.tag }}

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: bash .github/scripts/update-homebrew-formula.sh ${{ needs.version.outputs.tag }}
